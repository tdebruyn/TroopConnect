{% extends "base.html" %}
{% load i18n %}
{% block content %}
    {% if page_html %}
        {{ page_html|safe }}
        <style>{{ page_css|safe }}</style>
    {% else %}
        {% include "homepage/snippets/faq_default.html" %}
    {% endif %}
    {% if user.is_superuser %}
        <a href="{% url 'homepage_editor' %}?page=faq"
           class="btn btn-outline-secondary position-absolute bottom-0 end-0 m-3">
            ✎ {% trans "Edit this page" %}
        </a>
    {% endif %}
{% endblock content %}
