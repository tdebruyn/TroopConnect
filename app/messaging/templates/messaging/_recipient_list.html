{% load i18n %}
{% for token in loaded_groups %}
<input type="hidden" name="loaded_groups" value="{{ token }}">
{% endfor %}
<input type="hidden" name="known_recipients" value="{% for entry in recipients %}{{ entry.person.pk }}{% if not forloop.last %},{% endif %}{% endfor %}">
{% if recipients %}
<table class="table table-striped">
    <thead>
        <tr>
            <th style="width: 50px;">
                <input type="checkbox"
                       class="form-check-input"
                       id="select-all"
                       checked>
            </th>
            <th>{% trans "Name" %}</th>
            <th>{% trans "Info" %}</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in recipients %}
            <tr>
                <td>
                    <input type="checkbox"
                           class="form-check-input recipient-checkbox"
                           name="recipient_{{ entry.person.pk }}"
                           {% if entry.checked %}checked{% endif %}>
                </td>
                <td>{{ entry.person.first_name }} {{ entry.person.last_name }}</td>
                <td>{{ entry.detail }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
<script>
    document.getElementById('select-all').addEventListener('change', function() {
        document.querySelectorAll('.recipient-checkbox').forEach(function(cb) {
            cb.checked = document.getElementById('select-all').checked;
        });
    });
</script>
{% else %}
<p class="text-muted">{% trans "No recipient found." %}</p>
{% endif %}
