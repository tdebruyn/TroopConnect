{% load i18n %}
<form hx-post="{{ request.path }}"
      hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'
      class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title">{% trans "Delete document" %}</h5>
    <button type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="{% trans 'Close' %}"></button>
  </div>
  <div class="modal-body">
    <p>
      {% blocktranslate %}Delete “{{ document }}”? It leaves every reader’s documents page.{% endblocktranslate %}
    </p>
  </div>
  <div class="modal-footer">
    <button type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">{% trans "Cancel" %}</button>
    <button type="submit" class="btn btn-outline-danger">{% trans "Delete" %}</button>
  </div>
</form>
