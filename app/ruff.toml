# Ruff configuration — https://docs.astral.sh/ruff/configuration/
# Lives inside app/ because the dev Docker container only mounts ./app -> /app,
# so a repo-root config would be invisible when tests run in-container.

target-version = "py313"   # Dockerfile.dev: python:3.13-slim
line-length = 88

[lint]
# Pragmatic Django baseline: catches real bugs (Pyflakes F), style/pep8 (E,W),
# import sorting (I), modern syntax (UP), common pitfalls (B), Django idioms (DJ).
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = [
    "E501",  # line-too-long — a formatting concern; run `ruff format` separately if wanted
    "DJ001", # django-nullable-model-string-field — fixing changes model fields and creates DB migrations
]

[lint.per-file-ignores]
"**/migrations/*" = ["ALL"]   # auto-generated by Django; never hand-edit

[lint.isort]
known-first-party = ["members", "troopconnect", "finance", "homepage", "messaging"]
