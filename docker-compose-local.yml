# Local development stack.
#
# The values below stand in for the .env a real deployment needs: DEBUG is on,
# mail is printed to the container log unless MAILERSEND_API_KEY is exported,
# and SITE_DOMAIN is localhost so `manage.py check` stays quiet.
#
# `docker compose` reads a .env file at the repo root for ${...} interpolation,
# which is where MAILERSEND_API_KEY comes from (see .env.example).

x-dev-env: &dev-env
  PATH: /venv/bin:$PATH
  DJANGO_DEBUG: "1"
  SITE_DOMAIN: localhost
  EMAIL_URL: console://
  DEFAULT_FROM_EMAIL: dev@localhost
  ACME_EMAIL: dev@localhost
  POSTGRES_HOST: postgres
  POSTGRES_USER: dbuser
  POSTGRES_PASSWORD: localpassword
  POSTGRES_DB: troopconnect
  CELERY_BROKER_URL: redis://redis:6379/0
  MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}

services:
  postgres:
    image: postgres:alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=localpassword
      - POSTGRES_USER=dbuser
      - POSTGRES_DB=troopconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dev_network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dev_network

  web:
    build:
      context: .
      dockerfile: app/Dockerfile.dev
    image: troopconnect-dev:latest
    command: uv run /app/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app/:/app
    ports:
      - "8000:8000"
    environment: *dev-env
    depends_on:
      - postgres
      - redis
    networks:
      - dev_network

  celery:
    image: troopconnect-dev
    command: celery -A troopconnect worker -l INFO
    volumes:
      - ./app/:/app
      - celery_data:/tmp
    environment: *dev-env
    depends_on:
      - postgres
      - redis
      - web
    networks:
      - dev_network

  celery-beat:
    image: troopconnect-dev
    command: celery -A troopconnect beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./app/:/app
      - celery_data:/tmp
    environment:
      <<: *dev-env
      CELERY_WORKER_STATE_DB: /tmp/celery-worker-state.db
    depends_on:
      - postgres
      - redis
      - web
    networks:
      - dev_network

networks:
  dev_network:

volumes:
  postgres_data_dev:
  celery_data:
