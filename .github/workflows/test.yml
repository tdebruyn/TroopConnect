name: test

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Test suite and lint
    runs-on: ubuntu-latest

    services:
      # Matches the versions compose.yml runs, so a test never passes here and
      # fails for a troop.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: troopconnect
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: troopconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U troopconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The settings module reads every deployment value from the environment,
      # so these are the same variables a self-hoster puts in .env -- pointed at
      # the services above. `manage.py check` fails the run if one is missing.
      DJANGO_SETTINGS_MODULE: troopconnect.settings
      SECRET_KEY: ci-only-not-a-real-secret
      SITE_DOMAIN: localhost
      EMAIL_URL: console://
      DEFAULT_FROM_EMAIL: ci@example.org
      ACME_EMAIL: ci@example.org
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: troopconnect
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: troopconnect
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      # Run separately from the suite as well as inside it (tests.test_lint):
      # here it reports the problems, there it fails the build.
      - name: Lint
        run: ruff check app

      - name: Test
        working-directory: app
        run: python manage.py test tests
