version: 2

updates:
  # requirements.txt uses compatible-release ranges, so minors and patches
  # arrive on the next install; Dependabot opens a pull request for versions
  # that leave the range, which is mostly majors.
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A Django minor bump lands in python-minor, where it reads as one patch
      # among eight and fails the whole group's build. It stays ignored until
      # django-celery-beat drops its Django<6.1 ceiling; patch bumps of the 6.0
      # series still come through.
      - dependency-name: "django"
        update-types: ["version-update:semver-minor"]
    groups:
      # Patch and minor bumps arrive as one pull request rather than fifteen;
      # majors stay separate because they need reading.
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The base images in Dockerfile.prod and Dockerfile.dev.
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    groups:
      docker-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # postgres, redis and caddy in compose.yml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
