# Mail forwarding for the troop's own domain.
#
# Part of the community-maintained Ansible deployment in contrib/ansible, which
# starts this file from the mailforwarder role. It is not part of the supported
# installation (compose.yml) and is not started by it.

services:
  mail-forward:
    image: zixia/simple-mail-forwarder
    # Written by the Ansible playbook (or by hand from .env.example); also
    # supplies ${MAILSERVER} for the certificate volume below.
    env_file: ".env"
    environment:
      - SMF_SRS=true
      - SMF_POSTFIXMAIN_sender_canonical_maps=tcp:localhost:10001
      - SMF_POSTFIXMAIN_sender_canonical_classes=envelope_sender
      - SMF_POSTFIXMAIN_recipient_canonical_maps=tcp:localhost:10002
      - SMF_POSTFIXMAIN_recipient_canonical_classes=envelope_recipient,header_recipient
      - SMF_POSTFIXMAIN_mynetworks=127.0.0.0/8 172.16.0.0/13
    volumes:
      - dkim:/var/db/dkim
      - /etc/letsencrypt/live/${MAILSERVER}:/etc/postfix/cert
    ports:
      - "25:25"
      - "587:587"
    networks:
      - shared_net
volumes:
  dkim:

networks:
  shared_net:
    external: true
